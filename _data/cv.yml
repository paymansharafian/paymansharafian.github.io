        summary: Lead technical development across human-robot interaction, sensing, teleoperation, and deployment work for healthcare robotics research.
        highlights:
          - Lead architect for the Adaptive Nursing Assistant Robot (ARNA) NSF project.
          - Built a real-time sensor fusion pipeline using custom DAQ hardware and Singer-model Kalman filters.
          - Developed a Temporal Convolutional Network that reached an 84% detection rate, outperforming CNN/LSTM baselines.
          - Led CAD, fabrication, and integration of sensorized handle hardware with tactile arrays and ATI force/torque sensors.
          - Architected a distributed ROS network and Next.js web interface for low-latency teleoperation and FastSAM-guided grasping.
          - Directed pilot-study operations, co-authored IRB protocols, and mentored 30+ students through manuals and SOPs.

