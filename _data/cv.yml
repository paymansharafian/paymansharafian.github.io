        highlights:
          - Engineered an audio-visual perception system for an interactive social robot used in autism therapy.
          - Designed the Baby Tank open-source mobile robotics platform and integrated navigation and low-level control.
          - Built a cross-platform Activity Reminder GUI in C++ and Qt Creator with an accessibility focus.

